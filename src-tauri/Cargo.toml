[package]
name = "celepkg"
version = "0.1.0"
description = "A Celeste map manager"
authors = ["celepkg"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "celepkg_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
thiserror = "2"
walkdir = "2"
zip = "2"
