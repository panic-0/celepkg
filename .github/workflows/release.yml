name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Release (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: celepkg-${{ matrix.platform }}-${{ runner.arch }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.zip
            src-tauri/target/release/bundle/**/*.AppImage.sig
            src-tauri/target/release/bundle/**/*.deb.sig
            src-tauri/target/release/bundle/**/*.dmg.sig
            src-tauri/target/release/bundle/**/*.exe.sig
            src-tauri/target/release/bundle/**/*.msi.sig
            src-tauri/target/release/bundle/**/*.rpm.sig
            src-tauri/target/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/release/bundle/**/*.zip.sig
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Write release notes
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            $0 ~ "^## " tag "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            {
              echo "## CelePkg ${GITHUB_REF_NAME}"
              echo
              echo "构建产物包含 Windows、macOS 和 Linux 桌面安装包。"
            } > RELEASE_NOTES.md
          fi

      - name: Generate updater manifest
        run: |
          node .github/scripts/generate-latest-json.mjs \
            --assets release-assets \
            --notes RELEASE_NOTES.md \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}" \
            --out release-assets/latest.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -d '' assets < <(
            find release-assets -type f \( \
              -name '*.AppImage' -o \
              -name '*.deb' -o \
              -name '*.dmg' -o \
              -name '*.exe' -o \
              -name '*.msi' -o \
              -name '*.rpm' -o \
              -name '*.app.tar.gz' -o \
              -name '*.zip' -o \
              -name '*.AppImage.sig' -o \
              -name '*.deb.sig' -o \
              -name '*.dmg.sig' -o \
              -name '*.exe.sig' -o \
              -name '*.msi.sig' -o \
              -name '*.rpm.sig' -o \
              -name '*.app.tar.gz.sig' -o \
              -name '*.zip.sig' -o \
              -name 'latest.json' \
            \) -print0
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets found."
            exit 1
          fi

          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
            gh release edit "${GITHUB_REF_NAME}" \
              --title "CelePkg ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" \
              --title "CelePkg ${GITHUB_REF_NAME}" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag
          fi
