name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Tests and Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-checks-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-checks-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Lint CSS
        run: npm run lint:css

      - name: Test frontend
        run: npm test

      - name: Test release scripts
        run: npm run test:scripts

      - name: Check release metadata
        run: npm run check:release

      - name: Build frontend
        run: npm run build:web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Test UI layout
        run: npm run test:layout

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  tauri-build:
    name: Build Tauri (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    needs: checks
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-24.04
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop app (Unix)
        if: runner.os != 'Windows'
        run: |
          status=0
          for attempt in 1 2 3; do
            npx tauri build --ci --no-sign && exit 0
            status=$?

            if [ "$attempt" -lt 3 ]; then
              delay=$((15 * attempt))
              echo "Desktop bundle build failed with exit code $status. Retrying in $delay seconds..."
              sleep "$delay"
            fi
          done

          exit "$status"

      - name: Build desktop app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exitCode = 0
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npx tauri build --ci --no-sign
            $exitCode = $LASTEXITCODE
            if ($exitCode -eq 0) {
              exit 0
            }

            if ($attempt -lt 3) {
              $delay = 15 * $attempt
              Write-Host "Windows bundle build failed with exit code $exitCode. Retrying in $delay seconds..."
              Start-Sleep -Seconds $delay
            }
          }

          exit $exitCode

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: celepkg-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.rpm
          if-no-files-found: error
